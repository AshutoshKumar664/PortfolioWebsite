<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Contact | Ashutosh Kumar</title>
  <link rel="stylesheet" href="css/contact.css">
</head>
<body>
  <div id="header"></div>
  <main>
    <section class="page-title">
      <div class="container">
        <!-- <div class="small-title">Contact</div> -->
        <h1>Let's <span class="gradient">connect</span>.</h1>
        <p>Interested in working together or have an opportunity to share? Let's connect.</p>
      </div>
    </section>
    <section class="section">
      <div class="container grid-2">
        <div class="card">
          <h2>Get in touch</h2>
          <div class="contact-item"><strong>Email</strong><span>aashu2004kr@gmail.com</span></div>
          <div class="contact-item"><strong>Phone</strong><span>7091580785</span></div>
          <div class="contact-item"><strong>GitHub</strong><span>github.com/AshutoshKumar664</span></div>
          <div class="contact-item"><strong>LinkedIn</strong><span>linkedin.com/in/ashutosh-kumar-184227341</span></div>
          <div class="socials">
            <a href="https://github.com/AshutoshKumar664" target="_blank">GitHub</a>
            <a href="https://www.linkedin.com/in/ashutosh-kumar-184227341/" target="_blank">LinkedIn</a>
            <a href="https://leetcode.com/u/18ashutosh45" target="_blank">LeetCode</a>
          </div>
        </div>
        <div class="card">
          <h2>Send a message</h2>
          <div id="formMessage" class="message success"></div>
          <form id="contactForm">
            <div class="form-group"><label for="name">Name</label><input id="name" type="text" placeholder="Your name"><div class="error" id="nameError"></div></div>
            <div class="form-group"><label for="email">Email</label><input id="email" type="email" placeholder="you@example.com"><div class="error" id="emailError"></div></div>
            <div class="form-group"><label for="message">Message</label><textarea id="message" placeholder="Write your message..."></textarea><div class="error" id="messageError"></div></div>
            <button class="btn btn-primary" type="submit">Send Message</button>
          </form>
        </div>
      </div>
    </section>

  </main>
  <div id="footer"></div>
  <script src="js/common.js"></script>
  <script src="js/contact.js"></script>
</body>
</html>
